<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/chatgpt-favicon.svg?v=20260824" />
    <title>Codex Web Console</title>
    <script>
      (() => {
        const theme = localStorage.getItem("codex-web-color-theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const platform = navigator.userAgentData?.platform || navigator.platform || navigator.userAgent;
        if (/Win/i.test(platform)) document.documentElement.dataset.platform = "windows";
        else if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) document.documentElement.dataset.platform = "mobile";
      })();
    </script>
    <script>
      (() => {
        const phoneQuery = window.matchMedia("(max-width: 900px)");
        let frame = 0;

        function syncPhoneViewport() {
          frame = 0;
          const root = document.documentElement;
          if (!phoneQuery.matches) {
            root.style.removeProperty("--phone-viewport-height");
            return;
          }
          const viewportHeight = Math.round(window.visualViewport?.height || window.innerHeight);
          root.style.setProperty("--phone-viewport-height", `${viewportHeight}px`);
          if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
        }

        function schedulePhoneViewportSync() {
          if (frame) cancelAnimationFrame(frame);
          frame = requestAnimationFrame(syncPhoneViewport);
        }

        schedulePhoneViewportSync();
        phoneQuery.addEventListener?.("change", schedulePhoneViewportSync);
        window.addEventListener("resize", schedulePhoneViewportSync, { passive: true });
        window.addEventListener("orientationchange", schedulePhoneViewportSync, { passive: true });
        window.addEventListener("scroll", schedulePhoneViewportSync, { passive: true });
        window.visualViewport?.addEventListener("resize", schedulePhoneViewportSync, { passive: true });
        window.visualViewport?.addEventListener("scroll", schedulePhoneViewportSync, { passive: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <div class="v2PlusMenu" id="v2PlusMenu" hidden>
      <span class="v2MenuSection">添加</span>
      <button type="button" data-action="upload"><span class="v2MenuIcon" data-icon="upload"></span><span><strong>文件和文件夹</strong><small>上传到当前工作区</small></span></button>
      <button type="button" data-action="goal"><span class="v2MenuIcon" data-icon="goal"></span><span><strong>持续目标</strong><small>输入目标后发送</small></span></button>
      <button type="button" data-action="plan" aria-pressed="false"><span class="v2MenuIcon" data-icon="plan"></span><span><strong>计划模式</strong><small>先审方案，再决定是否执行</small></span></button>
      <button type="button" data-action="skills"><span class="v2MenuIcon" data-icon="skills"></span><span><strong>技能与插件</strong><small>选择当前可用的能力</small></span></button>
      <span class="v2MenuSection">会话</span>
      <button type="button" data-action="send-markdown"><span class="v2MenuIcon" data-icon="send"></span><span><strong>发送对话记录到本机</strong><small>发送当前会话记录</small></span></button>
      <button type="button" data-action="context"><span class="v2MenuIcon" data-icon="context"></span><span><strong>上下文状态</strong><small>查看会话上下文与压缩设置</small></span></button>
      <span class="v2MenuSection">工作区</span>
      <button type="button" data-action="writing"><span class="v2MenuIcon" data-icon="writing"></span><span><strong>LaTeX / Word 写作</strong><small>编辑、编译与引用文档选区</small></span></button>
      <button type="button" data-action="worktree"><span class="v2MenuIcon" data-icon="worktree"></span><span><strong>独立工作树</strong><small>隔离改动并接力当前会话</small></span></button>
      <button type="button" data-action="archive-list"><span class="v2MenuIcon" data-icon="archive-list"></span><span><strong>归档会话</strong><small>查看并恢复已归档对话</small></span></button>
      <button type="button" data-action="archive-current"><span class="v2MenuIcon" data-icon="archive-current"></span><span><strong>归档当前会话</strong><small>从列表收起，随时可恢复</small></span></button>
      <button type="button" data-action="terminal"><span class="v2MenuIcon" data-icon="terminal"></span><span><strong>交互终端</strong><small>在当前工作区运行命令</small></span></button>
      <button type="button" data-action="hooks"><span class="v2MenuIcon" data-icon="hooks"></span><span><strong>Hooks 状态</strong><small>检查与审核当前工作区</small></span></button>
      <span class="v2MenuSection">设置与用量</span>
      <button type="button" data-action="settings"><span class="v2MenuIcon" data-icon="settings"></span><span><strong>设备与导出设置</strong><small>配置文件发送和对话导出</small></span></button>
      <button type="button" data-action="quota"><span class="v2MenuIcon" data-icon="quota"></span><span><strong>剩余用量</strong><small>查看额度与重置时间</small></span></button>
      <button type="button" data-action="leaderboard"><span class="v2MenuIcon" data-icon="leaderboard"></span><span><strong>排行榜</strong><small>查看 Token 使用排行</small></span></button>
    </div>

    <script type="module">
      import { Plus, FolderUpload, Target, Application, Send, ChartPie, Setting, Time, Trophy, Plan, Branch, History, FileCollection, Terminal, FileEditing } from "@icon-park/svg";
      (() => {
        const plusMenu = document.getElementById("v2PlusMenu");
        let plusCloseTimer = 0;
        let plusPositionFrame = 0;
        const positionPlusMenu = () => {
          plusPositionFrame = 0;
          if (plusMenu.hidden || plusMenu.classList.contains("uiClosing")) return;
          const anchor = document.querySelector(".v2ComposerPlus");
          if (!anchor) return;
          const viewport = window.visualViewport;
          const viewportTop = viewport?.offsetTop || 0;
          const viewportLeft = viewport?.offsetLeft || 0;
          const viewportWidth = viewport?.width || window.innerWidth;
          const viewportHeight = viewport?.height || window.innerHeight;
          const rect = anchor.getBoundingClientRect();
          const width = Math.min(440, viewportWidth - 24);
          const bottom = Math.min(rect.top - 8, viewportTop + viewportHeight - 12);
          const availableHeight = Math.max(40, bottom - viewportTop - 12);
          plusMenu.style.boxSizing = "border-box";
          plusMenu.style.width = `${width}px`;
          plusMenu.style.maxHeight = `${Math.min(600, availableHeight)}px`;
          plusMenu.style.left = `${Math.max(viewportLeft + 12, Math.min(rect.left, viewportLeft + viewportWidth - width - 12))}px`;
          plusMenu.style.bottom = "auto";
          plusMenu.style.top = `${Math.max(viewportTop + 12, bottom - plusMenu.offsetHeight)}px`;
        };
        const schedulePlusPosition = () => {
          if (plusPositionFrame) cancelAnimationFrame(plusPositionFrame);
          plusPositionFrame = requestAnimationFrame(positionPlusMenu);
        };
        window.addEventListener("resize", schedulePlusPosition, { passive: true });
        window.visualViewport?.addEventListener("resize", schedulePlusPosition, { passive: true });
        window.visualViewport?.addEventListener("scroll", schedulePlusPosition, { passive: true });
        const plusAnchorObserver = new ResizeObserver(schedulePlusPosition);
        const closePlusMenu = () => {
          if (plusMenu.hidden || plusMenu.classList.contains("uiClosing")) return;
          plusMenu.classList.add("uiClosing");
          document.querySelector(".v2ComposerPlus")?.setAttribute("aria-expanded", "false");
          clearTimeout(plusCloseTimer);
          plusCloseTimer = window.setTimeout(() => {
            plusMenu.hidden = true;
            plusMenu.classList.remove("uiClosing");
          }, window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 200);
        };
        const iconOptions = { theme: "outline", size: 18, fill: "currentColor", strokeWidth: 4, strokeLinecap: "round", strokeLinejoin: "round" };
        const iconMarkup = (icon, size = 18) => icon({ ...iconOptions, size })
          .replace(/^<\?xml[^>]*>/, "")
          .replace("<svg ", '<svg aria-hidden="true" focusable="false" ');
        const menuIcons = { upload: FolderUpload, goal: Target, plan: Plan, skills: Application, send: Send, context: ChartPie, writing: FileEditing, worktree: Branch, "archive-list": History, "archive-current": FileCollection, terminal: Terminal, hooks: Setting, settings: Setting, quota: Time, leaderboard: Trophy };
        plusMenu.querySelectorAll("[data-icon]").forEach((slot) => {
          const icon = menuIcons[slot.dataset.icon];
          if (icon) slot.innerHTML = iconMarkup(icon);
        });

        function clickExisting(selector, pattern) {
          const direct = document.querySelector(selector);
          if (direct) { direct.click(); return; }
          [...document.querySelectorAll("button")].find((button) => pattern.test(button.textContent || ""))?.click();
        }

        function installShellBridges() {
          const threadList = document.querySelector(".threadList");
          if (threadList) {
            const applySidebarWidth = (width) => {
              // During conversation switches the grid briefly reports 0px.
              // Do not persist that transient layout state into the fixed V2 dock.
              if (Number.isFinite(width) && width >= 180) {
                document.documentElement.style.setProperty("--v2-sidebar-width", `${width}px`);
              }
            };
            applySidebarWidth(threadList.getBoundingClientRect().width);
            if (!window.__v2SidebarResizeObserver) {
              window.__v2SidebarResizeObserver = new ResizeObserver((entries) => {
                const width = entries[0]?.contentRect.width;
                if (width !== undefined) applySidebarWidth(width);
              });
              window.__v2SidebarResizeObserver.observe(threadList);
            }
          }
          const listLabel = document.querySelector(".threadList .listHeader > span:first-child");
          if (listLabel) listLabel.textContent = "项目";
          const conversationTitle = document.querySelector(".conversationHeader h2");
          if (conversationTitle?.textContent?.trim() === "New Thread") conversationTitle.textContent = "新对话";
          const emptyState = document.querySelector(".conversation .emptyState");
          if (emptyState?.textContent?.includes("Ready for a new Codex turn")) emptyState.textContent = "从当前项目开始一个新的 Codex 对话";
          const controls = document.querySelector(".topbar .controls");
          const quotaTop = controls?.querySelector(".quotaButton.v2QuotaTopButton");
          if (quotaTop) quotaTop.title = "悬停查看额度详情";
          const tools = document.querySelector(".composerTools");
          if (!tools) return;
          if (tools.querySelector(".v2ComposerPlus")) {
            const textarea = document.querySelector(".composer textarea");
            if (textarea) textarea.placeholder = "随心输入";
            return;
          }
          [...tools.children].forEach((element) => {
            if (/上传|额度|Skills|技能|插入 skill|导出记录/i.test(element.textContent || "")) element.classList.add("v2MovedIntoPlus");
          });
          const plus = document.createElement("button");
          plus.type = "button";
          plus.className = "v2ComposerPlus";
          plus.setAttribute("aria-expanded", "false");
          plus.innerHTML = iconMarkup(Plus, 20);
          plus.title = "添加文件、能力或查看用量";
          plus.addEventListener("click", (event) => {
            event.stopPropagation();
            const opening = plusMenu.hidden || plusMenu.classList.contains("uiClosing");
            if (opening) {
              clearTimeout(plusCloseTimer);
              plusMenu.classList.remove("uiClosing");
              plusMenu.hidden = false;
              plus.setAttribute("aria-expanded", "true");
              const goalButton = plusMenu.querySelector('[data-action="goal"]');
              goalButton.disabled = document.querySelector('.composer[data-has-thread="true"]') === null;
              goalButton.title = goalButton.disabled ? "请先开始一个会话，再设定持续目标" : "";
              const planBridge = document.querySelector('.composer .v2PlanModeBridge');
              const planButton = plusMenu.querySelector('[data-action="plan"]');
              const planEnabled = planBridge?.getAttribute('aria-pressed') === 'true';
              planButton.setAttribute('aria-pressed', String(planEnabled));
              planButton.querySelector('small').textContent = planEnabled ? '已开启；点击关闭' : '先审方案，再决定是否执行';
              const hasProject = Boolean(document.querySelector('.projectTitle .recordMapping'));
              const hasThread = document.querySelector('.composer[data-has-thread="true"]') !== null;
              for (const action of ['writing', 'worktree', 'archive-list', 'archive-current', 'terminal', 'hooks']) {
                plusMenu.querySelector(`[data-action="${action}"]`).disabled = !hasProject || (action === 'archive-current' && !hasThread);
              }
              plusMenu.querySelector('[data-action="worktree"] small').textContent = hasThread ? '隔离改动并接力当前会话' : '创建隔离的工作区会话';
              positionPlusMenu();
              schedulePlusPosition();
            } else closePlusMenu();
          });
          tools.prepend(plus);
          plusAnchorObserver.disconnect();
          plusAnchorObserver.observe(tools.closest(".composer"));

          const textarea = document.querySelector(".composer textarea");
          if (textarea) textarea.placeholder = "随心输入";
        }

        plusMenu.addEventListener("click", (event) => {
          const action = event.target.closest("button")?.dataset.action;
          if (!action) return;
          if (action === "upload") document.querySelector(".hiddenFileInput")?.click();
          if (action === "send-markdown") document.querySelector(".v2SendMarkdownLocalAction")?.click();
          if (action === "settings") document.querySelector(".v2SettingsBridge")?.click();
          if (action === "quota") clickExisting(".quotaButton", /额度|剩余用量/);
          if (action === "leaderboard") clickExisting(".leaderboardButton", /排行榜/);
          if (action === "skills") clickExisting(".skillsButton", /Skills|技能|插件/);
          if (action === "plan") document.querySelector('.composer .v2PlanModeBridge')?.click();
          if (action === "context") clickExisting(".v2ContextStatusButton", /上下文|会话状态/);
          if (action === "goal") window.dispatchEvent(new CustomEvent("codex:compose-goal"));
          if (["writing", "worktree", "archive-list", "archive-current", "terminal", "hooks"].includes(action)) window.dispatchEvent(new CustomEvent("codex:workspace-action", { detail: action }));
          closePlusMenu();
        });

        let scheduled = false;
        const observer = new MutationObserver(() => {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(() => {
            scheduled = false;
            installShellBridges();
          });
        });
        observer.observe(document.getElementById("root"), { childList: true, subtree: true });
        installShellBridges();

        document.addEventListener("click", (event) => {
          if (!plusMenu.contains(event.target) && !event.target.closest(".v2ComposerPlus")) closePlusMenu();
        });
      })();
    </script>
  </body>
</html>
